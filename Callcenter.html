<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Center</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            margin: 0;
            transition: transform 0.5s ease-in-out;
            overflow: hidden;
        }
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 18px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            transition: background 0.3s;
        }
        .navbar a:hover {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            width: 350px;
            text-align: center;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        .card:hover {
            transform: rotateY(10deg) rotateX(10deg);
        }
        h1 {
            font-size: 24px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
        }
        .btn {
            background: linear-gradient(135deg, #ff7eb3, #ff758c);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            margin: 10px;
        }
        .btn:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 3px 10px rgba(255, 117, 140, 0.5);
        }
    </style>
    <script>
        function goToNextPage() {
            document.body.style.transform = "rotateY(180deg)";
            setTimeout(() => {
                window.location.href = 'TaxationService.html';
            }, 500);
        }
        function goBack() {
            document.body.style.transform = "rotateY(-180deg)";
            setTimeout(() => {
                window.history.back();
            }, 500);
        }
        function register() {
            document.body.style.transform = "rotateX(180deg)";
            setTimeout(() => {
                window.location.href = 'RegistrationForm.html';
            }, 500);
        }
    </script>
</head>
<body>
    <video class="video-background" autoplay muted loop>
        <source src="1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <nav class="navbar">
        <a href="https://ebmcambodia.com/">Home</a>
        <a href="">Services</a>
        <a href="https://ebmcambodia.com/about.html">About</a>
        <a href="https://ebmcambodia.com/contact.html">Contact</a>
    </nav>
    <div class="card">
        <h1>Call Center</h1>
        <p>Looking to outsource your call center? We work with our client (MNC) for years, to assist our client handle their call inbound and outbound, promotion campaign and more. Our experiences definitely contribute to your business growth.</p>
        <p></p>
        <ul>
           
            
            
        </ul>
        <p>
            <button class="btn" onclick="goToNextPage()">Next Page</button>
            <button class="btn" onclick="goBack()">Go Back</button>
            <button class="btn" onclick="register()">Register</button>
        </p>
    </div>
</body>
</html>
